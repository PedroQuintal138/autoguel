<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Login - Autoguel</title>
</head>
<body>
    <header class="button">
        <a href="index.html" class="btn-link">← Início</a>
        <a href="catalogo.html" class="btn-link">Catálogo</a>
        <a href="reserva.html" class="btn-link">Reserva</a>
        <a href="cadastro.html" class="submit">Cadastre-se</a>
    </header>
    
    <main class="containerLogin">
        <a href="index.html">
            <img class="logo" src="img/logo.png" alt="Logo Autoguel">
        </a>
        <form class="form" action="index.html" method="get">
            <label class="label">
                Email ou CPF
                <input class="input" type="text" name="usuario" placeholder="Digite seu e-mail ou CPF" required>
            </label>

            <label class="label">
                Senha
                <input class="input" type="password" name="senha" placeholder="Digite sua senha" required>
            </label>

            <input value="Entrar" type="submit" class="submit">
        </form>
    </main>
</body>
</html>
